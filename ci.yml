# ============================================
# Semantic Plagiarism Detector - CI/CD Pipeline
# GitHub Actions workflow for testing, building, and deployment
# ============================================

name: CI/CD Pipeline

# ============================================
# Triggers
# ============================================
on:
  push:
    branches:
      - main
      - develop
      - feature/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 0 * * *'  # Daily security scan

# ============================================
# Environment Variables
# ============================================
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  DOCKER_IMAGE: semantic-plagiarism-detector

# ============================================
# Permissions
# ============================================
permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

# ============================================
# Jobs
# ============================================
jobs:

  # ------------------------------------------
  # Job 1: Lint & Code Style
  # ------------------------------------------
  lint:
    name: 🔍 Lint & Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install black flake8 mypy isort pylint bandit

      - name: Run Black (formatting check)
        run: |
          cd backend
          black --check --diff .

      - name: Run isort (import sorting)
        run: |
          cd backend
          isort --check-only --diff .

      - name: Run flake8 (style guide)
        run: |
          cd backend
          flake8 . --max-line-length=100 --count --statistics

      - name: Run mypy (type checking)
        run: |
          cd backend
          mypy . --ignore-missing-imports

      - name: Run pylint (code quality)
        run: |
          cd backend
          pylint src/ --fail-under=7.0 --exit-zero

      - name: Run bandit (security linting)
        run: |
          cd backend
          bandit -r . -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  # ------------------------------------------
  # Job 2: Unit Tests
  # ------------------------------------------
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx coverage

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: backend/test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: backend/htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

  # ------------------------------------------
  # Job 3: Frontend Tests
  # ------------------------------------------
  frontend-test:
    name: 🎨 Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run lint
        run: |
          cd frontend
          npm run lint --if-present

      - name: Run tests
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ------------------------------------------
  # Job 4: Build Docker Image
  # ------------------------------------------
  docker-build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: production
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  # ------------------------------------------
  # Job 5: Security Scan (Daily)
  # ------------------------------------------
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-results
          path: trivy-fs-results.sarif

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'semantic-plagiarism-detector'
          path: '.'
          format: 'HTML'
          out: 'reports'

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # ------------------------------------------
  # Job 6: Deploy to Staging
  # ------------------------------------------
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "=========================================="
          echo "Deploying to staging environment..."
          echo "=========================================="
          echo "Environment: Staging"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="

  # ------------------------------------------
  # Job 7: Deploy to Production
  # ------------------------------------------
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "=========================================="
          echo "Deploying to production environment..."
          echo "=========================================="
          echo "Environment: Production"
          echo "Tag: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="

  # ------------------------------------------
  # Job 8: Create Release
  # ------------------------------------------
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, frontend-test, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            backend/coverage.xml
            backend/bandit-report.json

  # ------------------------------------------
  # Job 9: Notify on Failure
  # ------------------------------------------
  notify-failure:
    name: 📧 Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-test, docker-build]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "=========================================="
          echo "❌ CI/CD Pipeline Failed!"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "=========================================="