# pytest.ini
# Configuration for the pytest test runner.
#
# Issue #2989: Un-mock embedding models in CI/Integration tests.
# We define a custom 'integration' marker to separate tests that require
# actual ML model weights and real network/ML operations from standard
# unit tests that use mocks. This allows CI pipelines to run integration
# tests only on specific runners (e.g., Ubuntu with sufficient RAM/GPU).

[pytest]
# Minimum pytest version required
minversion = 7.0

# Test discovery paths
testpaths = 
    tests

# Python files to consider as test modules
python_files = 
    test_*.py
    *_test.py

# Python classes to consider as test classes
python_classes = 
    Test*
    *Test

# Python functions to consider as test functions
python_functions = 
    test_*

# Default command-line options for pytest
# Issue #3773: Parallel test execution across CPU cores using pytest-xdist
# -n auto: automatically detect available CPU cores to parallelize test execution
# --dist=loadscope: group tests by module/class to guarantee safe, deterministic
# execution without cross-test race conditions on shared fixtures or SQLite databases
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -n auto
    --dist=loadscope
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --ignore=tests/api/test_background_clustering_issue_3122.py
    --ignore=tests/api/test_database_clear.py
    --ignore=tests/api/test_scan_jobs_redis_issue_3222.py
    --ignore=tests/app/test_date_presets.py
    --ignore=tests/core/test_corrupted_document_regression.py
    --ignore=tests/core/test_plagiarism_scan_concurrency.py
    --ignore=tests/core/test_similarity_mutation.py
    --ignore=tests/core/test_similarity_mutationn.py
    --ignore=tests/core/tests/core/test_corrupted_doc_regression.py
    --ignore=tests/core/tests/core/test_plgiarism_scan_concurrency.py
    --ignore=tests/e2e
    --ignore=tests/test_corpus_db_connections.py
    --ignore=tests/test_database.py
    --ignore=tests/test_incidents_bulk.py
    --ignore=tests/test_ocr_heuristic.py
    --ignore=tests/test_paraphrase_fingerprinter.py
    --ignore=tests/test_threshold_boundary.py
    --ignore=tests/ui/test_exception_handler.py
    --ignore=tests/utils/test_json_export.py
    --ignore=tests/utils/test_storage_metrics.py
    --ignore=tests/utils/test_streamed_zip_reading_issue_3197.py
    --ignore=tests/utils/test_warning_list_fuzzy.py
    --ignore=tests/utils/test_warning_list_sort.py
    --ignore=tests/core/test_standalone_image_ocr_issue_2720.py
    --ignore=tests/core/test_tracing.py
    --ignore=tests/utils/test_memory_monitor.py

# Custom markers registration (Issue #2989)
# Registering markers prevents pytest from emitting warnings about
# unknown markers when running with --strict-markers.
markers =
    unit: Standard unit tests that use mocks and run quickly.
    integration: Integration tests that use real ML models and external services. These tests are slower and require more resources.
    slow: Tests that take a long time to run (> 10 seconds).
    gpu: Tests that require a CUDA-enabled GPU.
    apple_silicon: Tests specifically for Apple Silicon (M1/M2) compatibility.
    cli: Tests for the command-line interface.
    api: Tests for the FastAPI REST API endpoints.
    ui: Tests for the Streamlit UI components.
    e2e: Marks Playwright end-to-end tests (Issue #3030).
    asyncio: Marks asynchronous coroutine tests.

# Filter warnings to keep test output clean
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
    # Ignore specific warnings from third-party libraries
    ignore:.*distutils Version classes are deprecated.*:DeprecationWarning
    ignore:.*imp module is deprecated.*:DeprecationWarning

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# JUnit XML output for CI/CD integration
junit_family = xunit2

# Environment variables for tests
env =
    MPLBACKEND = Agg
