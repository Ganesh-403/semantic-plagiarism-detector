version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8501:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    expose:
      - "8501"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - APP_BASE_URL=http://localhost:8501
      # Scheduled plagiarism rescan (disabled unless set > 0). See
      # src/core/scheduler.py and .env.example for details.
      - RESCAN_INTERVAL_MINUTES=${RESCAN_INTERVAL_MINUTES:-0}
      - RESCAN_GRACE_PERIOD_MINUTES=${RESCAN_GRACE_PERIOD_MINUTES:-60}
    volumes:
      - ./.streamlit:/app/.streamlit
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
