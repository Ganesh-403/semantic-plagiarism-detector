name: Generate Release Notes

on:
  workflow_dispatch:
  release:
    types: [created]

  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Release Notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
