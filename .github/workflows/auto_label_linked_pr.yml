name: Auto-update Issue Labels on PR Link

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  update-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Extract linked issues and update labels
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || "";
            // Match patterns like Fixes #123, Closes #123, Resolves #123, or just #123
            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)?\s*#(\d+)/gi;
            const matches = [...prBody.matchAll(issueRegex)];

            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1], 10)))];

            if (issueNumbers.length === 0) {
              console.log("No linked issues found in PR body.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const issueNumber of issueNumbers) {
              console.log(`Processing issue #${issueNumber}`);
              try {
                // Add 'PR Pending' label and remove 'good first issue' label
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['PR Pending']
                });

                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: 'good first issue'
                  });
                  console.log(`Successfully removed 'good first issue' from issue #${issueNumber}`);
                } catch (err) {
                  console.log(`Label 'good first issue' might not exist on issue #${issueNumber}`);
                }
              } catch (error) {
                console.error(`Failed to update labels for issue #${issueNumber}:`, error);
              }
            }
