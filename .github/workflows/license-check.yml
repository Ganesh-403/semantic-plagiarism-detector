name: License Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-audit:
    name: Dependency License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies and pip-licenses
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Audit dependency licenses
        run: |
          echo "Auditing open-source dependency licenses..."
          pip-licenses --format=markdown
          pip-licenses --format=json --output-file=license-report.json

          # Fail if any GPL / AGPL / LGPL copyleft licenses are detected
          pip-licenses --partial-match --fail-on "GPL;GPLv2;GPLv3;AGPL;AGPLv3;LGPL;LGPLv2;LGPLv3;GNU General Public License;GNU Affero General Public License;GNU Lesser General Public License"

      - name: Upload license inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: license-report.json
