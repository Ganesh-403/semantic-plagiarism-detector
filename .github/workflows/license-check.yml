name: License Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-audit:
    name: Dependency License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies and pip-licenses
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install "numpy>=1.26.0,<2.5.0"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Audit dependency licenses
        run: |
          echo "Auditing open-source dependency licenses..."
          pip-licenses --format=markdown
          
          # Fail if any GPL / AGPL / LGPL copyleft licenses are detected
          pip-licenses --fail-on "GPL;GPLv2;GPLv3;AGPL;AGPLv3;LGPL;LGPLv2;LGPLv3;GNU General Public License;GNU Affero General Public License;GNU Lesser General Public License"
