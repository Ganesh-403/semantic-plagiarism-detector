# Continuous Integration Workflow
#
# This workflow runs on every push and pull request to the main branch.
# It ensures code quality, executes tests, and checks for known security
# vulnerabilities in third-party dependencies.

name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Cancel in-progress runs for the same ref (branch or tag) when a new run is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Python syntax and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Issue #695 Implementation: Enabling pip cache
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install quality tools
        run: python -m pip install ruff==0.16.5 yamllint

      - name: Check Python syntax
        run: python -m compileall -q app src scripts tests evaluation

      - name: Run YAML Linter (yamllint)
        run: |
          yamllint .github/ docker-compose.yml .pre-commit-config.yaml

      - name: Run Ruff Linter
        run: |
          ruff check .

  markdown-lint:
    name: Markdown Formatting Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !node_modules
            !.github/ISSUE_TEMPLATE/**

  test:
    name: Execute Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Modified: Fetch full git history required for diff-cover comparison

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # Issue #695 Implementation: Enabling pip cache
          cache-dependency-path: '**/requirements*.txt'

      # Issue #3483: Cache HuggingFace transformer model weights
      - name: Cache HuggingFace Hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-paraphrase-multilingual-MiniLM-L12-v2-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-paraphrase-multilingual-MiniLM-L12-v2-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt diff-cover
          python -m nltk.downloader punkt_tab stopwords

      - name: Streamlit startup smoke test
        run: python scripts/smoke_streamlit.py

      - name: API startup smoke test
        run: python scripts/smoke_api.py

      - name: Run Test Runner (Parallel)
        run: |
          chmod +x scripts/run_tests.py
          python scripts/run_tests.py --parallel --coverage

      - name: Enforce Coverage Threshold (≥85%)
        if: always() && hashFiles('.coverage') != ''
        # Resolves #1616 – fail the build if total coverage drops below 85 %.
        run: |
          coverage report --fail-under=85
          coverage xml  # Added: Generate coverage.xml required for diff-cover

      - name: Enforce Diff Coverage Threshold (≥90%) for New Code
        # Resolves #3492 - Diff coverage enforcement for new code
        # Runs only on Pull Requests and dynamically compares against the base branch.
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage.xml') != ''
        run: |
          git fetch origin ${{ github.base_ref }}
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90

      - name: Upload Coverage to Action Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            test-reports/

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and audit tools
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Audit installed runtime dependencies
        run: python scripts/audit_dependencies.py --output security-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-report
          path: security-report.json
