# Continuous Integration Workflow
#
# This workflow runs on every push and pull request to the main branch.
# It ensures code quality, executes tests, and checks for known security
# vulnerabilities in third-party dependencies.

name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Cancel in-progress runs for the same ref (branch or tag) when a new run is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Issue #695 Implementation: Enabling pip cache
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint mypy pip-audit pytest pytest-cov
          # Pre-install numpy<2.5.0 so pip's resolver doesn't try to pull
          # numpy 2.5.x (which requires Python >=3.12) on Python 3.9-3.11.
          pip install "numpy>=1.26.0,<2.5.0"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Mypy (Type Check)
        run: |
          mypy src/

      - name: Security Scan
        run: pip-audit -r requirements.txt --desc on --ignore-vuln PYSEC-2022-252

      - name: Upload Security Report
        if: failure()
        run: |
          pip-audit -r requirements.txt -f json > security-report.json || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pip-audit-report
          path: security-report.json

  test:
    name: Execute Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # Issue #695 Implementation: Enabling pip cache
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist
          # Pre-install numpy<2.5.0 so pip's resolver doesn't try to pull
          # numpy 2.5.x (which requires Python >=3.12) on Python 3.9-3.11.
          pip install "numpy>=1.26.0,<2.5.0"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Runner (Parallel)
        run: |
          chmod +x scripts/run_tests.py
          python scripts/run_tests.py --parallel --coverage

      - name: Enforce Coverage Threshold (≥85%)
        # Resolves #1616 – fail the build if total coverage drops below 85 %.
        # The previous step already ran pytest with --cov, which writes .coverage.
        # This step reads that data and exits non-zero when the threshold is not met.
        run: |
          coverage report --fail-under=85

      - name: Upload Coverage to Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
