# Automated Dependency Update Checking Workflow
#
# This workflow checks for outdated Python dependencies on a weekly
# schedule and uploads the outdated package report as a workflow
# artifact, keeping the project's dependencies up to date.

name: Dependency Update Check

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  # Allow the workflow to be triggered manually from the Actions tab
  workflow_dispatch:
  pull_request:
    branches:
      - main
# Cancel in-progress runs for the same ref (branch or tag) when a new run is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-check:
    name: Check for Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install pip-audit
        run: |
          pip install pip-audit
      - name: Check for outdated packages
        run: |
          mkdir -p reports
          # Capture the list of outdated packages into a report file
          pip list --outdated --format columns > reports/outdated-packages.txt || true
          echo "Outdated package report written to reports/outdated-packages.txt"
          echo "--- Report Preview ---"
          cat reports/outdated-packages.txt

      - name: Upload outdated package report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-packages-report
          path: reports/outdated-packages.txt
          if-no-files-found: error

      - name: Run pip-audit (JSON)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p reports
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format json -o reports/pip-audit.json || true
          else
            pip-audit --format json -o reports/pip-audit.json || true
          fi

      - name: Post vulnerability summary comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/pip-audit.json';
            if (!fs.existsSync(path)) return;

            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const vulns = data.dependencies
              ? data.dependencies.filter(dep => dep.vulns && dep.vulns.length > 0)
              : [];

            if (vulns.length === 0) return;

            let body = '### ⚠️ Known vulnerabilities found in dependencies\n\n';
            body += '| Package | Version | CVE / ID | Description |\n';
            body += '|---|---|---|---|\n';
            for (const dep of vulns) {
              for (const v of dep.vulns) {
                const desc = (v.description || '').replace(/\|/g, '\\|').slice(0, 150);
                body += `| ${dep.name} | ${dep.version} | ${v.id} | ${desc} |\n`;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
